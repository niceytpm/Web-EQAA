<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ค้นหา ID MACHINE</title>
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-title" content="EquipmentAA">
<meta name="application-name" content="EquipmentAA">
<meta name="theme-color" content="#000000">
<script src="xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#000;margin:0;padding:16px;display:flex;justify-content:center;align-items:flex-start;min-height:100vh;color:#fff}
.container{background:#1c1c1e;padding:24px 20px;border-radius:24px;width:100%;max-width:360px;box-shadow:0 10px 30px rgba(0,0,0,.5);display:flex;flex-direction:column;align-items:center;position:relative;margin-top:18px}
.header-area{display:flex;justify-content:center;align-items:center;width:100%;margin-bottom:20px;position:relative}
.header-title{color:#fff;font-size:20px;font-weight:600;display:flex;align-items:center;gap:6px;text-align:center}
.btn-history-trigger{position:absolute;left:0;background:transparent;border:none;font-size:22px;cursor:pointer;padding:0;display:flex;align-items:center}
.btn-factory{position:absolute;right:0;background:#2f80ed;color:#fff;border:none;width:34px;height:34px;border-radius:50%;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(47,128,237,.35)}
.factory-current{color:#2f80ed;font-size:12px;font-weight:700;margin-top:-12px;margin-bottom:12px;min-height:16px;text-align:center}
.search-row{display:flex;margin-bottom:18px;align-items:center;width:100%;border-bottom:1px solid #2c2c2e;padding-bottom:8px}
input{flex:1;background:transparent;border:none;color:#fff;font-size:18px;outline:none;width:100%;text-align:center}
input::placeholder{color:#55555c}
.btn-search{width:100%;background:#2f80ed;color:#fff;border:none;font-size:18px;font-weight:500;padding:12px;border-radius:12px;cursor:pointer;margin-bottom:18px;text-align:center}
.status{font-size:14px;color:#ff453a;text-align:center;margin-bottom:10px;min-height:18px}
.result-box{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;width:100%}
.tags-inline{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;width:100%}
.tag-gray{background:#242426;color:#fff;padding:6px 16px;border-radius:12px;font-size:15px;font-weight:bold;text-align:center}
.tag-blue-container{background:#101a2d;padding:6px 18px;border-radius:12px;display:inline-flex;justify-content:center}
.tag-blue-text{color:#2f80ed;font-size:16px;font-weight:bold;text-align:center}
.bottom-line{width:100%;height:1px;background:#2c2c2e;margin-top:15px}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.72);justify-content:center;align-items:center;z-index:1000;padding:16px}
.modal-content{background:#1c1c1e;padding:20px;border-radius:20px;width:100%;max-width:340px;border:1px solid #2c2c2e;display:flex;flex-direction:column;gap:12px}
.modal-title{color:#fff;font-size:17px;font-weight:600;text-align:center;margin-bottom:2px}
.modal-subtitle{color:#2f80ed;font-size:14px;font-weight:bold;text-align:center}
.factory-select{width:100%;background:#2c2c2e;color:#fff;border:1px solid #3a3a3c;border-radius:10px;padding:12px;font-size:16px;text-align:center;outline:none}
.btn-primary{background:#2f80ed;color:#fff;border:none;padding:11px;border-radius:10px;font-weight:700;cursor:pointer}
.btn-cancel{background:#3a3a3c;color:#fff;border:none;padding:10px;border-radius:8px;cursor:pointer}
.history-date-picker{width:100%;background:#2c2c2e;border:1px solid #3a3a3c;border-radius:8px;padding:8px;color:#fff;font-size:14px;text-align:center;outline:none}
.shift-tabs{display:flex;background:#2c2c2e;padding:2px;border-radius:8px;gap:2px}.shift-tab{flex:1;background:transparent;border:none;color:#8e8e93;padding:8px 0;font-size:12px;font-weight:500;border-radius:6px;cursor:pointer}.shift-tab.active{background:#101a2d;color:#2f80ed;font-weight:bold}
.history-list{max-height:220px;overflow-y:auto;display:flex;flex-direction:column;gap:8px}.history-item{background:#2c2c2e;padding:10px 12px;border-radius:8px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}.history-code{color:#fff;font-size:14px;font-weight:500}.history-time{color:#8e8e93;font-size:11px;text-align:right}

.close-code-fab{position:fixed;right:max(16px,calc(env(safe-area-inset-right) + 8px));bottom:max(16px,calc(env(safe-area-inset-bottom) + 8px));width:56px;height:56px;border:none;border-radius:50%;background:#2f80ed;color:#fff;font-size:24px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 26px rgba(47,128,237,.42);z-index:900;-webkit-tap-highlight-color:transparent;transition:transform .15s ease,box-shadow .15s ease}
.close-code-fab:active{transform:scale(.94);box-shadow:0 4px 14px rgba(47,128,237,.3)}
.close-code-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:1100;padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));align-items:center;justify-content:center;backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
.close-code-modal.open{display:flex;animation:fadeIn .16s ease-out}
.close-code-panel{background:#1c1c1e;border:1px solid #343438;border-radius:22px;width:100%;max-width:430px;max-height:min(84dvh,720px);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 18px 55px rgba(0,0,0,.58);animation:panelIn .18s ease-out}
.close-code-header{display:flex;align-items:center;justify-content:space-between;padding:15px 16px 12px;border-bottom:1px solid #2c2c2e;flex-shrink:0}
.close-code-title-wrap{display:flex;align-items:center;gap:9px}.close-code-icon{width:32px;height:32px;border-radius:10px;background:#101a2d;color:#2f80ed;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:800}
.close-code-title{font-size:18px;font-weight:700;color:#fff}.close-code-subtitle{font-size:11px;color:#8e8e93;margin-top:2px}
.close-code-x{width:34px;height:34px;border:none;border-radius:50%;background:#2c2c2e;color:#fff;font-size:21px;cursor:pointer;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent}
.close-code-body{padding:14px 16px 16px;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.close-code-search-row{display:flex;gap:8px;align-items:stretch}.close-code-search{min-width:0;flex:1;background:#2c2c2e;border:1px solid #3a3a3c;border-radius:12px;color:#fff;padding:12px 13px;font-size:16px;text-align:left;outline:none}.close-code-search:focus{border-color:#2f80ed;box-shadow:0 0 0 2px rgba(47,128,237,.16)}.close-code-search::placeholder{color:#8e8e93}
.close-code-search-btn{width:46px;border:0;border-radius:12px;background:#2f80ed;color:#fff;font-size:18px;cursor:pointer;-webkit-tap-highlight-color:transparent}.close-code-search-btn:active{transform:scale(.97)}
.close-code-categories{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-top:11px;background:#171719;padding:4px;border-radius:12px}.close-code-category{border:0;background:transparent;color:#8e8e93;border-radius:9px;padding:8px 5px;font-size:12px;font-weight:700;cursor:pointer;-webkit-tap-highlight-color:transparent}.close-code-category.active{background:#2f80ed;color:#fff}.close-code-category-count{font-size:10px;opacity:.72;margin-left:2px}.close-code-section-title{font-size:12px;color:#8e8e93;font-weight:700;margin:14px 0 8px}.close-code-chips{display:flex;gap:7px;flex-wrap:wrap}.close-code-chip{border:1px solid #35353a;background:#242426;color:#e9e9eb;border-radius:999px;padding:7px 10px;font-size:12px;cursor:pointer;-webkit-tap-highlight-color:transparent}.close-code-chip:active{background:#313136}
.close-code-status{font-size:12px;color:#8e8e93;margin-top:12px;min-height:16px}.close-code-results{display:flex;flex-direction:column;gap:9px;margin-top:8px}
.close-code-card{background:#242426;border:1px solid #303034;border-radius:14px;padding:12px;display:flex;align-items:center;gap:10px}.close-code-main{min-width:0;flex:1}.close-code-topline{display:flex;align-items:center;gap:6px;min-width:0}.close-code-name{font-size:15px;font-weight:700;color:#fff;line-height:1.3;overflow-wrap:anywhere}.close-code-cat-badge{flex:0 0 auto;font-size:9px;font-weight:800;padding:3px 6px;border-radius:999px;background:#101a2d;color:#2f80ed;border:1px solid #19315a}.close-code-original{display:none;font-size:10px;color:#636366;margin-top:4px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.close-code-meta{font-size:11px;color:#8e8e93;margin-top:3px}.close-code-code{font-size:18px;color:#2f80ed;font-weight:800;letter-spacing:.2px;margin-top:5px}.close-code-copy{border:none;background:#101a2d;color:#2f80ed;border-radius:10px;padding:9px 10px;font-size:12px;font-weight:800;cursor:pointer;min-width:70px;-webkit-tap-highlight-color:transparent}.close-code-copy.copied{background:#14301f;color:#30d158}.close-code-copy:active{transform:scale(.97)}
.close-code-empty{color:#8e8e93;text-align:center;padding:26px 8px 12px;font-size:13px}.close-code-note{font-size:11px;color:#636366;text-align:center;margin-top:12px;line-height:1.45}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}@keyframes panelIn{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}
@media(max-width:520px){.close-code-modal{align-items:flex-end;padding-left:10px;padding-right:10px;padding-bottom:max(10px,env(safe-area-inset-bottom))}.close-code-panel{max-height:min(88dvh,720px);border-radius:22px 22px 18px 18px}}
@media(min-width:700px){.container{margin-top:38px}.close-code-fab{right:max(28px,calc(env(safe-area-inset-right) + 12px));bottom:max(28px,calc(env(safe-area-inset-bottom) + 12px))}}

</style>
</head>
<body>
<div class="container">
  <div class="header-area">
    <button class="btn-history-trigger" onclick="openHistoryModal()" aria-label="ประวัติ">🕒</button>
    <div class="header-title">🔍 ค้นหา ID MACHINE</div>
    <button class="btn-factory" onclick="openFactoryModal()" aria-label="เลือกโรงงาน" title="เลือกโรงงาน">🏭</button>
  </div>
  <div id="factoryCurrent" class="factory-current">กำลังโหลดโรงงาน...</div>
  <div class="search-row">
    <input id="machineCode" placeholder="ใส่หมายเลขเครื่อง" enterkeyhint="search" autocomplete="off" onkeydown="if(event.key==='Enter') searchMachine()">
  </div>
  <button class="btn-search" onclick="searchMachine()">ค้นหา</button>
  <div class="status" id="status"></div>
  <div id="result" style="width:100%;"></div>
</div>

<button class="close-code-fab" onclick="openCloseCodeModal()" aria-label="รหัสปิดงาน" title="รหัสปิดงาน">📋</button>

<div class="close-code-modal" id="closeCodeModal" aria-hidden="true">
  <div class="close-code-panel" role="dialog" aria-modal="true" aria-labelledby="closeCodeTitle">
    <div class="close-code-header">
      <div class="close-code-title-wrap">
        <div class="close-code-icon">#</div>
        <div><div class="close-code-title" id="closeCodeTitle">รหัสปิดงาน</div></div>
      </div>
      <button class="close-code-x" onclick="closeCloseCodeModal()" aria-label="ปิด">×</button>
    </div>
    <div class="close-code-body">
      <div class="close-code-search-row">
        <input id="closeCodeSearch" class="close-code-search" placeholder="ค้นหารหัสปิดงาน" enterkeyhint="search" autocomplete="off" autocapitalize="off" spellcheck="false">
        <button class="close-code-search-btn" onclick="searchCloseCodes(true)" aria-label="ค้นหารหัสปิดงาน">⌕</button>
      </div>
      <div class="close-code-categories" aria-label="หมวดรหัส">
        <button class="close-code-category active" id="ccCatTX" onclick="setCloseCodeCategory('TX AA')">TX AA</button>
        <button class="close-code-category" id="ccCatRX" onclick="setCloseCodeCategory('TRX FA')">TRX FA</button>
      </div>
      <div class="close-code-section-title">ค้นหาบ่อย</div>
      <div class="close-code-chips" id="closeCodeFrequent"></div>
      <div class="close-code-status" id="closeCodeStatus"></div>
      <div class="close-code-results" id="closeCodeResults"></div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="factoryModal">
  <div class="modal-content">
    <div class="modal-title">🏭 เลือกโรงงาน</div>
    <select id="factorySelect" class="factory-select"></select>
    <button class="btn-primary" onclick="confirmFactory()">เลือกโรงงานนี้</button>
    <button class="btn-cancel" onclick="closeModal('factoryModal')">ปิด</button>
  </div>
</div>

<div class="modal-overlay" id="historyModal">
  <div class="modal-content">
    <div class="modal-title">🕒 ประวัติการค้นหา</div>
    <div class="modal-subtitle" id="historyCount">จำนวนทั้งหมด: 0 รายการ</div>
    <input type="date" id="historyDate" class="history-date-picker" onchange="renderHistory()">
    <div class="shift-tabs">
      <button class="shift-tab active" id="tab-all" onclick="changeShift('all')">ทั้งหมด</button>
      <button class="shift-tab" id="tab-day" onclick="changeShift('day')">เช้า</button>
      <button class="shift-tab" id="tab-night" onclick="changeShift('night')">ดึก</button>
    </div>
    <div class="history-list" id="historyContainer"></div>
    <button class="btn-cancel" onclick="closeModal('historyModal')">ปิดหน้าต่าง</button>
  </div>
</div>

<script>
let rows=[];
let factories=[];
let currentShift='all';
const $=id=>document.getElementById(id);
const clean=v=>String(v??'').replace(/[\s\u00A0]+/g,'').toUpperCase();
const esc=v=>String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));
const factoryKey=f=>f.slug||String(f.excel||'').replace(/^data_/i,'').replace(/\.xlsx$/i,'')||f.name;

async function loadFactories(){
  try{
    const r=await fetch('factories.json?ts='+Date.now(),{cache:'no-store'});
    if(!r.ok) throw new Error('โหลดรายชื่อโรงงานไม่สำเร็จ');
    const j=await r.json();
    factories=Array.isArray(j)?j:(j.factories||[]);
  }catch(e){ factories=[]; $('factoryCurrent').textContent=e.message; }
  if(!factories.length){ $('factoryCurrent').textContent='ยังไม่มีรายชื่อโรงงาน'; return; }
  $('factorySelect').innerHTML=factories.map(f=>`<option value="${esc(factoryKey(f))}">${esc(f.name)}</option>`).join('');
  const saved=localStorage.getItem('eq_factory');
  $('factorySelect').value=factories.some(f=>factoryKey(f)===saved)?saved:factoryKey(factories[0]);
  await loadSelectedFactory();
}

function selectedFactory(){return factories.find(f=>factoryKey(f)===$('factorySelect').value)||factories[0]||{};}

async function loadSelectedFactory(){
  const f=selectedFactory();
  const key=factoryKey(f);
  if(!key)return;
  localStorage.setItem('eq_factory',key);
  $('factoryCurrent').textContent=`โรงงาน: ${f.name||key}`;
  $('status').style.color='#8e8e93'; $('status').textContent='กำลังโหลดข้อมูล...'; rows=[]; $('result').innerHTML='';
  const excelFile=String(f.excel||`data_${key}.xlsx`);
  try{
    const r=await fetch(`${encodeURI(excelFile)}?ts=${Date.now()}`,{cache:'no-store'});
    if(!r.ok) throw new Error('ยังไม่มีข้อมูลของโรงงานนี้');
    const buf=await r.arrayBuffer();
    const wb=XLSX.read(buf,{type:'array'});
    const aoa=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''});
    rows=aoa.slice(1).filter(x=>String(x[0]||'').trim()).map(x=>({id:x[0],model:x[1],no:x[2],department:x[3]}));
    $('status').textContent='';
  }catch(e){ $('status').style.color='#ff453a'; $('status').textContent=e.message||String(e); }
}

function searchMachine(){
  const code=clean($('machineCode').value);
  $('result').innerHTML=''; $('status').textContent='';
  if(!code){$('status').style.color='#ff453a';$('status').textContent='กรุณากรอก ID MACHINE';return;}
  const found=rows.filter(r=>clean(r.id)===code);
  saveHistory(code,found.length,selectedFactory().name||factoryKey(selectedFactory()));
  if(!found.length){$('status').style.color='#ff453a';$('status').textContent='ไม่พบข้อมูล';return;}
  $('result').innerHTML=found.map(r=>`<div class="result-box"><div class="tags-inline"><div class="tag-gray">${esc(r.model)}</div><div class="tag-gray">${esc(r.no)}</div></div><div class="tag-blue-container"><div class="tag-blue-text">${esc(r.department)}</div></div><div class="bottom-line"></div></div>`).join('');
}

function openFactoryModal(){
  const saved=localStorage.getItem('eq_factory'); if(saved)$('factorySelect').value=saved;
  $('factoryModal').style.display='flex';
}
async function confirmFactory(){closeModal('factoryModal');await loadSelectedFactory();$('machineCode').focus();}
function closeModal(id){$(id).style.display='none';}

function saveHistory(code,count,factory){
  const h=JSON.parse(localStorage.getItem('eq_machine_history')||'[]');
  h.unshift({code,count,factory,time:Date.now()});
  localStorage.setItem('eq_machine_history',JSON.stringify(h.filter(x=>Date.now()-x.time<48*60*60*1000).slice(0,150)));
}
function toDateInput(d){const x=new Date(d);return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`;}
function openHistoryModal(){if(!$('historyDate').value)$('historyDate').value=toDateInput(Date.now());renderHistory();$('historyModal').style.display='flex';}
function changeShift(s){currentShift=s;['all','day','night'].forEach(x=>$('tab-'+x).classList.toggle('active',x===s));renderHistory();}
function renderHistory(){
  const target=$('historyDate').value;
  let h=JSON.parse(localStorage.getItem('eq_machine_history')||'[]').filter(x=>Date.now()-x.time<48*60*60*1000);
  h=h.filter(x=>toDateInput(x.time)===target);
  if(currentShift!=='all')h=h.filter(x=>{const hr=new Date(x.time).getHours();return currentShift==='day'?(hr>=7&&hr<19):(hr<7||hr>=19)});
  $('historyCount').textContent=`จำนวนทั้งหมด: ${h.length} รายการ`;
  $('historyContainer').innerHTML=h.length?h.map(x=>`<div class="history-item" onclick="useHistory('${esc(x.code)}')"><div><div class="history-code">${esc(x.code)}</div><div style="color:#2f80ed;font-size:11px;margin-top:2px">${esc(x.factory||'')}</div></div><div class="history-time">${new Date(x.time).toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'})}<br>พบ ${x.count}</div></div>`).join(''):'<div style="color:#8e8e93;text-align:center;padding:14px">ยังไม่มีประวัติ</div>';
}

let closeCodeCategory='TX AA';

const ccNormalize=v=>String(v??'').toLowerCase().normalize('NFC').replace(/[\s\-_/\\.,:;()\[\]{}]+/g,'').trim();
function ccDistance(a,b){
  a=ccNormalize(a);b=ccNormalize(b);if(a===b)return 0;if(!a.length)return b.length;if(!b.length)return a.length;
  const prev=Array.from({length:b.length+1},(_,i)=>i),cur=new Array(b.length+1);
  for(let i=1;i<=a.length;i++){cur[0]=i;for(let j=1;j<=b.length;j++)cur[j]=Math.min(cur[j-1]+1,prev[j]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));for(let j=0;j<=b.length;j++)prev[j]=cur[j];}
  return prev[b.length];
}
function ccSimilarity(a,b){const x=ccNormalize(a),y=ccNormalize(b);const m=Math.max(x.length,y.length);return m?1-ccDistance(x,y)/m:1;}
function ccTermScore(raw,q,exact,prefix,contains,fuzzyBase){
  const t=ccNormalize(raw);if(!t)return 0;
  if(t===q)return exact;
  let best=0;
  if(t.startsWith(q)||q.startsWith(t))best=Math.max(best,prefix-Math.min(7,Math.abs(t.length-q.length)));
  else if(t.includes(q)||q.includes(t))best=Math.max(best,contains-Math.min(6,Math.abs(t.length-q.length)));
  if(Math.max(t.length,q.length)<=28){
    const sim=ccSimilarity(t,q);
    if(sim>=.86)best=Math.max(best,fuzzyBase+sim*8);
    else if(sim>=.74)best=Math.max(best,fuzzyBase-12+sim*10);
  }
  return Math.round(Math.min(100,best));
}
function ccScore(item,query){
  const q=ccNormalize(query);if(!q)return 0;
  let best=0;
  best=Math.max(best,ccTermScore(item.code,q,100,99,96,90));
  best=Math.max(best,ccTermScore(item.name,q,100,99,97,88));
  for(const t of (item.aliases||[]))best=Math.max(best,ccTermScore(t,q,100,98,96,90));
  for(const t of (item.keywords||[]))best=Math.max(best,ccTermScore(t,q,94,92,89,80));
  best=Math.max(best,ccTermScore(item.original,q,90,88,85,76));
  return Math.round(best);
}
function closeCodePool(){
  return closeCodes.filter(x=>x.category===closeCodeCategory);
}
function setCloseCodeCategory(cat){
  closeCodeCategory=cat;
  $('ccCatTX').classList.toggle('active',cat==='TX AA');
  $('ccCatRX').classList.toggle('active',cat==='TRX FA');
  renderCloseCodeFrequent();
  searchCloseCodes(false);
}
function getCloseCodeUsage(){try{return JSON.parse(localStorage.getItem('eq_close_code_usage')||'{}')}catch{return {}}}
function bumpCloseCodeUsage(code){const u=getCloseCodeUsage();u[code]=(u[code]||0)+1;localStorage.setItem('eq_close_code_usage',JSON.stringify(u));}
function getCloseCodeSearchTerms(){
  try{
    const x=JSON.parse(localStorage.getItem('eq_close_code_search_terms')||'{}');
    return x&&typeof x==='object'?x:{};
  }catch{return {}}
}
function bumpCloseCodeSearchTerm(term){
  const text=String(term||'').trim();
  if(!text)return;
  const all=getCloseCodeSearchTerms();
  const cat=closeCodeCategory;
  if(!all[cat]||typeof all[cat]!=='object')all[cat]={};
  const key=ccNormalize(text);
  if(!key)return;
  const old=all[cat][key]||{text:text,count:0,last:0};
  old.text=text;
  old.count=(old.count||0)+1;
  old.last=Date.now();
  all[cat][key]=old;
  localStorage.setItem('eq_close_code_search_terms',JSON.stringify(all));
  renderCloseCodeFrequent();
}
function renderCloseCodeFrequent(){
  const fallback=closeCodeCategory==='TX AA'
    ?['หาค่าไม่ได้','เอียง','UV','Lens','กาว','กล้อง']
    :['FA เอียง','UV','กาว','กล้อง','Sensor','Pressure'];
  const all=getCloseCodeSearchTerms();
  const data=all[closeCodeCategory]||{};
  const used=Object.values(data)
    .filter(x=>x&&x.text)
    .sort((a,b)=>(b.count||0)-(a.count||0)||(b.last||0)-(a.last||0))
    .map(x=>x.text);
  const labels=[...used,...fallback]
    .filter((x,i,a)=>a.findIndex(y=>ccNormalize(y)===ccNormalize(x))===i)
    .slice(0,6);
  $('closeCodeFrequent').innerHTML=labels.map(text=>`<button type="button" class="close-code-chip" data-term="${esc(text)}">${esc(text)}</button>`).join('');
}
function useCloseCodeChip(text){$('closeCodeSearch').value=text;searchCloseCodes(true);}
function searchCloseCodes(countUsage=false){
  const q=$('closeCodeSearch').value.trim();
  const status=$('closeCodeStatus'),box=$('closeCodeResults');
  box.innerHTML='';
  const pool=closeCodePool();
  if(!q){
    status.textContent='';
    renderCloseCodeDefault();return;
  }
  const exactCode=pool.find(item=>ccNormalize(item.code)===ccNormalize(q));
  const matches=exactCode?[{item:exactCode,score:100}]:pool.map(item=>({item,score:ccScore(item,q)})).filter(x=>x.score>=60).sort((a,b)=>b.score-a.score||a.item.code.localeCompare(b.item.code)).slice(0,12);
  if(!matches.length){
    status.textContent='ไม่พบรหัส';
    box.innerHTML='';
    return;
  }
  status.textContent='';
  renderCloseCodeResults(matches);
  if(countUsage)bumpCloseCodeSearchTerm(q);
}
function renderCloseCodeDefault(){
  const usage=getCloseCodeUsage();
  const pool=closeCodePool();
  const used=[...pool].filter(x=>(usage[x.code]||0)>0).sort((a,b)=>(usage[b.code]||0)-(usage[a.code]||0)).slice(0,5);
  if(used.length){
    renderCloseCodeResults(used.map(item=>({item,score:null})));
  }else{
    $('closeCodeResults').innerHTML='';
  }
}
function renderCloseCodeResults(matches){
  $('closeCodeResults').innerHTML=matches.map(({item})=>`<div class="close-code-card"><div class="close-code-main"><div class="close-code-topline"><span class="close-code-cat-badge">${esc(item.category)}</span><div class="close-code-name">${esc(item.name)}</div></div><div class="close-code-original">${esc(item.original)}</div><div class="close-code-code">${esc(item.code)}</div></div><button type="button" class="close-code-copy" data-code="${esc(item.code)}">คัดลอก</button></div>`).join('');
}
async function copyCloseCode(code,btn){
  let ok=false;
  try{
    if(navigator.clipboard&&window.isSecureContext){
      await navigator.clipboard.writeText(code);
      ok=true;
    }
  }catch(e){}
  if(!ok){
    const ta=document.createElement('textarea');
    ta.value=code;
    ta.style.position='fixed';
    ta.style.left='-9999px';
    ta.style.top='0';
    ta.style.fontSize='16px';
    ta.style.opacity='0.01';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    try{ta.setSelectionRange(0,ta.value.length);}catch(e){}
    try{ok=document.execCommand('copy');}catch(e){ok=false;}
    ta.remove();
  }
  if(ok){
    bumpCloseCodeUsage(code);
    btn.textContent='✓ คัดลอกแล้ว';
    btn.classList.add('copied');
    setTimeout(()=>{btn.textContent='คัดลอก';btn.classList.remove('copied')},1200);
  }else{
    btn.textContent='คัดลอกไม่ได้';
    setTimeout(()=>btn.textContent='คัดลอก',1400);
  }
}
function openCloseCodeModal(){
  const m=$('closeCodeModal');m.classList.add('open');m.setAttribute('aria-hidden','false');document.body.style.overflow='hidden';
  $('closeCodeSearch').value='';$('closeCodeStatus').textContent='';renderCloseCodeFrequent();renderCloseCodeDefault();
  setTimeout(()=>$('closeCodeSearch').focus({preventScroll:true}),120);
}
function closeCloseCodeModal(){const m=$('closeCodeModal');m.classList.remove('open');m.setAttribute('aria-hidden','true');document.body.style.overflow='';}
$('closeCodeSearch').addEventListener('input',()=>searchCloseCodes(false));
$('closeCodeSearch').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();searchCloseCodes(true);}});
$('closeCodeFrequent').addEventListener('click',e=>{
  const btn=e.target.closest('.close-code-chip');
  if(!btn)return;
  useCloseCodeChip(btn.dataset.term||btn.textContent||'');
});
$('closeCodeResults').addEventListener('click',e=>{
  const btn=e.target.closest('.close-code-copy');
  if(!btn)return;
  copyCloseCode(btn.dataset.code||'',btn);
});

window.onclick=e=>{if(e.target.classList.contains('modal-overlay'))e.target.style.display='none';if(e.target.id==='closeCodeModal')closeCloseCodeModal();};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('closeCodeModal').classList.contains('open'))closeCloseCodeModal();});
renderCloseCodeFrequent();
loadFactories();
</script>
</body>
